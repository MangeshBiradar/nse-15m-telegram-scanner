name: NSE+BSE Pre-Market Data Refresh

on:
  schedule:
    # Refresh latest completed trading-day data before the market opens.
    - cron: "30 8 * * 1-5"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh completed-day market snapshot
        run: python market_data.py

      - name: Store refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_snapshot.csv
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Refresh pre-market market snapshot"
            git pull --rebase origin main
            git push
          fi
