name: On-demand Chartink Conditions Scanner

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "Universe source"
        required: true
        type: choice
        options:
          - Current symbols.csv (NSE+BSE equity universe)
        default: "Current symbols.csv (NSE+BSE equity universe)"

permissions:
  contents: read

concurrency:
  group: on-demand-chartink-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner (manual only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: on-demand-scan-results
          path: |
            scan_results.csv
            scan_errors.csv
          if-no-files-found: warn
          retention-days: 30
