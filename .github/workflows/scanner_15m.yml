name: NSE+BSE Base Condition Scanner

on:
  workflow_dispatch:
  schedule:
    # Times are explicitly India Standard Time.
    # Run away from the top of the hour to reduce GitHub scheduler delays.
    - cron: "20 9 * * 1-5"
      timezone: "Asia/Kolkata"
    - cron: "20 12 * * 1-5"
      timezone: "Asia/Kolkata"
    - cron: "0 15 * * 1-5"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: base-condition-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }}
        run: python scanner.py

      - name: Store scan history and matching signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan_results.csv scan_runs.csv state.json
          if git diff --cached --quiet; then
            echo "No scan files changed."
            exit 0
          fi
          git commit -m "Store scanner results"
          git pull --rebase origin main
          git push
