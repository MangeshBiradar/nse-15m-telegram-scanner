name: NSE+BSE MSB Daily Pre-Market Scanner

on:
  workflow_dispatch:
  schedule:
    # 08:50 IST, Monday-Friday (25 minutes before NSE open)
    - cron: "50 8 * * 1-5"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MSB daily pre-market scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_TYPE: Scheduled
        run: |
          python scanner.py

      - name: Commit scan results and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan_results.csv state.json
          if git diff --cached --quiet; then
            echo "No result/state changes to commit."
          else
            git commit -m "Store daily MSB scan results"
            git push
          fi
