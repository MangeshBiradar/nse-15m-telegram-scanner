name: NSE+BSE Base Condition Scanner

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These are intended IST run times:
    # 09:20 IST, 12:20 IST and 15:00 IST, Monday-Friday.
    - cron: "50 3 * * 1-5"
    - cron: "50 6 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: base-condition-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }}
        run: python scanner.py

      - name: Store scan history and matching signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan_results.csv scan_runs.csv state.json
          if git diff --cached --quiet; then
            echo "No scan files changed."
            exit 0
          fi
          git commit -m "Store scanner results"
          git pull --rebase origin main
          git push
