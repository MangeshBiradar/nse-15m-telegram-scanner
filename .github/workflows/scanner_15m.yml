name: NSE+BSE MSB Scanner

on:
  workflow_dispatch:
  schedule:
    # Exactly three scans per trading day, India time.
    - cron: "15 9 * * 1-5"
      timezone: "Asia/Kolkata"
    - cron: "15 12 * * 1-5"
      timezone: "Asia/Kolkata"
    - cron: "15 15 * * 1-5"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: base-condition-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }}
        run: python scanner.py

      - name: Store scan history and matching signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan_results.csv scan_runs.csv state.json
          if git diff --cached --quiet; then
            echo "No scan files changed."
          else
            git commit -m "Store scanner results"
            git pull --rebase origin main
            git push
          fi

      # Refresh the completed daily/weekly/monthly snapshot after the first
      # scan of the day. The 09:15 scan intentionally uses yesterday's
      # completed snapshot; this refresh prepares fresh AS-OF data for the
      # 12:15 and 15:15 scans without creating a fourth scheduled workflow.
      - name: Refresh snapshot after morning scan
        if: github.event_name == 'schedule' && github.event.schedule == '15 9 * * 1-5'
        run: python market_data.py

      - name: Store refreshed snapshot
        if: github.event_name == 'schedule' && github.event.schedule == '15 9 * * 1-5'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_snapshot.csv
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Refresh market snapshot"
            git pull --rebase origin main
            git push
          fi
