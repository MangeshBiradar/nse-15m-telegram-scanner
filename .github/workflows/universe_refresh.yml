name: NSE+BSE Universe Daily Refresh

on:
  workflow_dispatch:
  schedule:
    # 08:45 IST = 03:15 UTC, once each weekday before NSE opens.
    - cron: "15 3 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh NSE+BSE stock universe
        run: |
          python universe.py

      - name: Build daily market snapshot
        run: |
          python market_data.py

      - name: Validate AS-OF market snapshot
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("market_snapshot.csv")
          required = {"ticker", "weekly_history", "monthly_history", "monthly_rsi"}
          missing = sorted(required - set(df.columns))
          if missing:
              raise SystemExit(f"Snapshot schema missing: {missing}")
          if len(df) < 500:
              raise SystemExit(f"Snapshot validation failed: {len(df)} rows")
          if df["weekly_history"].isna().sum() > len(df) * 0.01:
              raise SystemExit("Snapshot validation failed: too many missing weekly histories")
          if df["monthly_history"].isna().sum() > len(df) * 0.01:
              raise SystemExit("Snapshot validation failed: too many missing monthly histories")
          print(f"AS-OF snapshot OK: {len(df)} stocks")
          PY

      - name: Commit refreshed universe and market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add symbols.csv market_snapshot.csv
          if git diff --cached --quiet; then
            echo "Universe and market snapshot unchanged."
          else
            git commit -m "Refresh NSE BSE universe and market snapshot"
            git push
          fi
