name: Angel One Stock Screener

on:
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe to scan (nifty50, nifty500, all)'
        required: true
        default: 'nifty500'
      skip_cmp_sma:
        description: 'Skip Condition 5 (CMP > Daily 20 SMA)?'
        type: boolean
        default: false
  schedule:
    # Mon-Fri at 8:45 AM IST (03:15 UTC) - builds cache & scans pre-market
    - cron: '15 3 * * 1-5'
    # Mon-Fri at 9:20 AM IST (03:50 UTC) - live market open scan
    - cron: '50 3 * * 1-5'
    # Mon-Fri at 3:15 PM IST (09:45 UTC) - pre-close scan
    - cron: '45 9 * * 1-5'

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore daily candle & token cache
        uses: actions/cache@v4
        with:
          path: |
            nse_tokens_cache.json
            candle_cache
          key: angel-cache-${{ github.run_id }}
          restore-keys: |
            angel-cache-

      - name: Install dependencies
        run: pip install -r v2/requirements.txt

      - name: Run Screener
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          UNIVERSE="${{ github.event.inputs.universe || 'nifty500' }}"
          SKIP_FLAG=""
          if [ "${{ github.event.inputs.skip_cmp_sma }}" == "true" ]; then
            SKIP_FLAG="--skip-cmp-sma"
          fi
          python v2/scanner.py --universe "$UNIVERSE" $SKIP_FLAG

      - name: Upload CSV Reports
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports-${{ github.run_number }}
          path: |
            *_matches.csv
            *_all_scan.csv
