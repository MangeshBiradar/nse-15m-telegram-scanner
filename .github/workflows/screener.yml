name: Angel One Stock Screener (v2)

on:
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe to scan (nifty50, nifty500, all)'
        required: true
        default: 'all'
      skip_cmp_sma:
        description: 'Skip Condition 5 (CMP > Daily 20 SMA)?'
        type: boolean
        default: false
      refresh_cache:
        description: 'Force refresh historical candle cache?'
        type: boolean
        default: false
      cache_only:
        description: 'Build cache only (skip Telegram alert)?'
        type: boolean
        default: false
  schedule:
    # Sun-Thu at 11:15 PM IST (17:45 UTC) - overnight low-traffic cache load
    - cron: '45 17 * * 0-4'
    # Mon-Fri every hour from 9:30 AM IST to 2:30 PM IST (04:00 to 09:00 UTC)
    - cron: '0 4-9 * * 1-5'
    # Mon-Fri at 3:25 PM IST (09:55 UTC) - final pre-close live scan
    - cron: '55 9 * * 1-5'

jobs:
  run-screener:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: v2/requirements.txt

      - name: Restore daily candle & token cache
        uses: actions/cache@v4
        with:
          path: |
            v2/nse_tokens_cache.json
            v2/candle_cache
          key: angel-v2-cache-${{ github.run_id }}
          restore-keys: |
            angel-v2-cache-

      - name: Install dependencies
        working-directory: .
        run: pip install -r v2/requirements.txt

      - name: Run Screener
        working-directory: .
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          UNIVERSE="${{ github.event.inputs.universe || 'all' }}"
          FLAGS=""

          # Overnight 11:15 PM IST schedule builds cache silently without sending Telegram alert
          if [ "${{ github.event.schedule }}" == "45 17 * * 0-4" ] || [ "${{ github.event.inputs.cache_only }}" == "true" ]; then
            FLAGS="$FLAGS --cache-only"
          fi

          if [ "${{ github.event.inputs.skip_cmp_sma }}" == "true" ]; then
            FLAGS="$FLAGS --skip-cmp-sma"
          fi

          if [ "${{ github.event.inputs.refresh_cache }}" == "true" ]; then
            FLAGS="$FLAGS --refresh-cache"
          fi

          cd v2 && python scanner.py --universe "$UNIVERSE" $FLAGS

      - name: Upload CSV Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports-v2-${{ github.run_number }}
          path: |
            v2/*_matches.csv
