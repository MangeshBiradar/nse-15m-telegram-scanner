name: MSB Scanner Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest_scanner.py"
      - "backtest_diagnostic.py"
      - "indicators.py"
      - "symbols.csv"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 3-month comparison backtest
        run: python backtest_scanner.py
      - name: Run 60-day diagnostic
        run: python backtest_diagnostic.py
      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: msb-backtest-results
          path: |
            backtest_summary.csv
            backtest_3m_base.csv
            backtest_exact_current_~60d.csv
            backtest_failures.csv